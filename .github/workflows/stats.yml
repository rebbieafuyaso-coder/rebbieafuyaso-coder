name: Generate Developer Stats

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate statistics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: rebbieafuyaso-coder
        run: |
          python3 <<'PY'
          import json
          import urllib.request
          import os
          from collections import Counter
          from datetime import datetime, timezone

          username = os.environ["USERNAME"]
          token = os.environ["GH_TOKEN"]

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28"
          }

          def api(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request) as response:
                  return json.loads(response.read())

          print("Fetching GitHub data...")

          user = api(f"https://api.github.com/users/{username}")

          repos = []
          page = 1

          while True:
              data = api(
                  f"https://api.github.com/users/{username}/repos"
                  f"?per_page=100&page={page}&sort=updated"
              )

              if not data:
                  break

              repos.extend(data)

              if len(data) < 100:
                  break

              page += 1

          languages = Counter()

          for repo in repos:
              try:
                  repo_languages = api(
                      f"https://api.github.com/repos/"
                      f"{username}/{repo['name']}/languages"
                  )

                  for language, amount in repo_languages.items():
                      languages[language] += amount

              except Exception as error:
                  print(
                      f"Could not fetch languages for "
                      f"{repo['name']}: {error}"
                  )

          total_bytes = sum(languages.values())

          language_percentages = []

          if total_bytes:
              for language, amount in languages.most_common(8):
                  percentage = (amount / total_bytes) * 100
                  language_percentages.append(
                      (language, percentage)
                  )

          os.makedirs("assets", exist_ok=True)

          with open("stats-data.json", "w") as f:
              json.dump({
                  "user": user,
                  "repositories": len(repos),
                  "languages": language_percentages
              }, f, indent=2)

          print("Data generated successfully.")
          PY

      - name: Generate SVG cards
        run: |
          python3 <<'PY'
          import json
          import html

          with open("stats-data.json") as f:
              data = json.load(f)

          user = data["user"]
          languages = data["languages"]

          name = html.escape(
              user.get("name") or user["login"]
          )

          username = user["login"]

          repos = user.get("public_repos", 0)
          followers = user.get("followers", 0)
          following = user.get("following", 0)

          # --------------------------------------------------
          # COMMON SVG HEADER
          # --------------------------------------------------

          def header(title, subtitle, width=760, height=360):
              return f'''<svg xmlns="http://www.w3.org/2000/svg"
              width="{width}"
              height="{height}"
              viewBox="0 0 {width} {height}">

              <defs>

                <linearGradient id="bg"
                  x1="0%" y1="0%"
                  x2="100%" y2="100%">

                  <stop offset="0%" stop-color="#0d1117"/>
                  <stop offset="100%" stop-color="#161b22"/>

                </linearGradient>

                <linearGradient id="accent"
                  x1="0%" y1="0%"
                  x2="100%" y2="0%">

                  <stop offset="0%" stop-color="#58a6ff"/>
                  <stop offset="100%" stop-color="#a371f7"/>

                </linearGradient>

                <filter id="shadow">

                  <feDropShadow
                    dx="0"
                    dy="8"
                    stdDeviation="12"
                    flood-opacity="0.25"/>

                </filter>

                <style>

                  .title {{
                    font-family:
                      -apple-system,
                      BlinkMacSystemFont,
                      "Segoe UI",
                      sans-serif;

                    font-size: 25px;
                    font-weight: 700;
                    fill: #f0f6fc;
                  }}

                  .subtitle {{
                    font-family:
                      -apple-system,
                      BlinkMacSystemFont,
                      "Segoe UI",
                      sans-serif;

                    font-size: 13px;
                    fill: #8b949e;
                  }}

                  .label {{
                    font-family:
                      -apple-system,
                      BlinkMacSystemFont,
                      "Segoe UI",
                      sans-serif;

                    font-size: 14px;
                    fill: #8b949e;
                  }}

                  .number {{
                    font-family:
                      -apple-system,
                      BlinkMacSystemFont,
                      "Segoe UI",
                      sans-serif;

                    font-size: 26px;
                    font-weight: 700;
                    fill: #f0f6fc;
                  }}

                  .animate {{
                    animation:
                      fadeIn 1.2s ease-out;
                  }}

                  @keyframes fadeIn {{
                    from {{
                      opacity: 0;
                      transform: translateY(8px);
                    }}

                    to {{
                      opacity: 1;
                      transform: translateY(0);
                    }}
                  }}

                </style>

              </defs>

              <rect
                width="100%"
                height="100%"
                rx="18"
                fill="url(#bg)"
                filter="url(#shadow)"/>

              <rect
                x="0"
                y="0"
                width="100%"
                height="4"
                rx="2"
                fill="url(#accent)"/>

              <text
                x="35"
                y="50"
                class="title">

                {title}

              </text>

              <text
                x="35"
                y="75"
                class="subtitle">

                {subtitle}

              </text>
          '''

          # --------------------------------------------------
          # GITHUB STATS
          # --------------------------------------------------

          svg = header(
              "GitHub Overview",
              f"@{username} · Developer activity"
          )

          cards = [
              ("📦", "Repositories", repos),
              ("👥", "Followers", followers),
              ("↗", "Following", following),
          ]

          x_positions = [35, 270, 505]

          for i, (icon, label, value) in enumerate(cards):

              x = x_positions[i]

              svg += f'''
              <g class="animate">

                <rect
                  x="{x}"
                  y="120"
                  width="200"
                  height="145"
                  rx="14"
                  fill="#161b22"
                  stroke="#30363d"/>

                <text
                  x="{x + 22}"
                  y="155"
                  font-size="22">

                  {icon}

                </text>

                <text
                  x="{x + 22}"
                  y="195"
                  class="label">

                  {label}

                </text>

                <text
                  x="{x + 22}"
                  y="235"
                  class="number">

                  {value}

                </text>

              </g>
              '''

          svg += '''
              <text
                x="35"
                y="320"
                class="subtitle">

                github.com/rebbieafuyaso-coder

              </text>

              </svg>
          '''

          with open("assets/github-stats.svg", "w") as f:
              f.write(svg)

          # --------------------------------------------------
          # TOP LANGUAGES
          # --------------------------------------------------

          svg = header(
              "Top Languages",
              "Languages used across public repositories",
              760,
              430
          )

          y = 120

          for language, percentage in languages:

              bar_width = 480
              width = max(
                  8,
                  bar_width * percentage / 100
              )

              svg += f'''
              <g class="animate">

                <text
                  x="35"
                  y="{y}"
                  class="label">

                  {html.escape(language)}

                </text>

                <text
                  x="725"
                  y="{y}"
                  class="label"
                  text-anchor="end">

                  {percentage:.1f}%

                </text>

                <rect
                  x="35"
                  y="{y + 12}"
                  width="{bar_width}"
                  height="9"
                  rx="4"
                  fill="#21262d"/>

                <rect
                  x="35"
                  y="{y + 12}"
                  width="{width}"
                  height="9"
                  rx="4"
                  fill="url(#accent)">

                  <animate
                    attributeName="width"
                    from="0"
                    to="{width}"
                    dur="1.2s"
                    fill="freeze"/>

                </rect>

              </g>
              '''

              y += 42

          svg += '''

            <text
              x="35"
              y="395"
              class="subtitle">

              Based on language usage across public repositories

            </text>

            </svg>
          '''

          with open("assets/top-languages.svg", "w") as f:
              f.write(svg)

          print("SVG cards generated.")
          PY

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/*.svg

          git diff --cached --quiet || \
            git commit -m "Update developer statistics"

          git push
