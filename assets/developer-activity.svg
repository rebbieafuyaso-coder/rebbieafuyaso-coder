<svg
    xmlns="http://www.w3.org/2000/svg"
    width="900"
    height="470"
    viewBox="0 0 900 470">

    <defs>

      <linearGradient
        id="background"
        x1="0%"
        y1="0%"
        x2="100%"
        y2="100%">

        <stop
          offset="0%"
          stop-color="#0d1117"/>

        <stop
          offset="100%"
          stop-color="#161b22"/>

      </linearGradient>

      <linearGradient
        id="accent"
        x1="0%"
        y1="0%"
        x2="100%"
        y2="0%">

        <stop
          offset="0%"
          stop-color="#58a6ff"/>

        <stop
          offset="50%"
          stop-color="#a371f7"/>

        <stop
          offset="100%"
          stop-color="#f778ba"/>

      </linearGradient>

      <filter id="shadow">

        <feDropShadow
          dx="0"
          dy="8"
          stdDeviation="12"
          flood-opacity="0.3"/>

      </filter>

      <style>

        .title {
          font-family:
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            sans-serif;

          font-size: 27px;
          font-weight: 700;
          fill: #f0f6fc;
        }

        .subtitle {
          font-family:
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            sans-serif;

          font-size: 14px;
          fill: #8b949e;
        }

        .label {
          font-family:
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            sans-serif;

          font-size: 14px;
          fill: #8b949e;
        }

        .value {
          font-family:
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            sans-serif;

          font-size: 27px;
          font-weight: 700;
          fill: #f0f6fc;
        }

        .card {
          fill: #161b22;
          stroke: #30363d;
          stroke-width: 1;
        }

        .fade {
          animation:
            fadeIn 0.8s ease-out both;
        }

        @keyframes fadeIn {

          from {
            opacity: 0;
            transform:
              translateY(8px);
          }

          to {
            opacity: 1;
            transform:
              translateY(0);
          }

        }

      </style>

    </defs>

    <rect
      width="100%"
      height="100%"
      rx="20"
      fill="url(#background)"
      filter="url(#shadow)"/>

    <rect
      width="100%"
      height="4"
      rx="2"
      fill="url(#accent)"/>

    <text
      x="36"
      y="52"
      class="title">

      Developer Activity

    </text>

    <text
      x="36"
      y="78"
      class="subtitle">

      Contribution activity over the last 12 months

    </text>


    <g
      class="fade"
      style="animation-delay:0.0s">

      <rect
        x="36"
        y="115"
        width="250"
        height="125"
        rx="15"
        class="card"/>

      <text
        x="58"
        y="155"
        class="label">

        Commits

      </text>

      <text
        x="58"
        y="201"
        class="value">

        0

      </text>

    </g>

    

    <g
      class="fade"
      style="animation-delay:0.08s">

      <rect
        x="325"
        y="115"
        width="250"
        height="125"
        rx="15"
        class="card"/>

      <text
        x="347"
        y="155"
        class="label">

        Pull Requests

      </text>

      <text
        x="347"
        y="201"
        class="value">

        0

      </text>

    </g>

    

    <g
      class="fade"
      style="animation-delay:0.16s">

      <rect
        x="614"
        y="115"
        width="250"
        height="125"
        rx="15"
        class="card"/>

      <text
        x="636"
        y="155"
        class="label">

        Issues

      </text>

      <text
        x="636"
        y="201"
        class="value">

        0

      </text>

    </g>

    

    <g
      class="fade"
      style="animation-delay:0.24s">

      <rect
        x="36"
        y="270"
        width="250"
        height="125"
        rx="15"
        class="card"/>

      <text
        x="58"
        y="310"
        class="label">

        Code Reviews

      </text>

      <text
        x="58"
        y="356"
        class="value">

        0

      </text>

    </g>

    

    <g
      class="fade"
      style="animation-delay:0.32s">

      <rect
        x="325"
        y="270"
        width="250"
        height="125"
        rx="15"
        class="card"/>

      <text
        x="347"
        y="310"
        class="label">

        Contributed Repositories

      </text>

      <text
        x="347"
        y="356"
        class="value">

        2

      </text>

    </g>

    

    <g
      class="fade"
      style="animation-delay:0.4s">

      <rect
        x="614"
        y="270"
        width="250"
        height="125"
        rx="15"
        class="card"/>

      <text
        x="636"
        y="310"
        class="label">

        Total Contributions

      </text>

      <text
        x="636"
        y="356"
        class="value">

        3

      </text>

    </g>

    

<text
  x="36"
  y="445"
  class="subtitle">

  Includes authenticated contribution data where GitHub makes it available.

</text>

</svg>