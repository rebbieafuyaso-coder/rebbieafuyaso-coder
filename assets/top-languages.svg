<svg
    xmlns="http://www.w3.org/2000/svg"
    width="900"
    height="470"
    viewBox="0 0 900 470">

    <defs>

      <linearGradient
        id="background"
        x1="0%"
        y1="0%"
        x2="100%"
        y2="100%">

        <stop
          offset="0%"
          stop-color="#0d1117"/>

        <stop
          offset="100%"
          stop-color="#161b22"/>

      </linearGradient>

      <linearGradient
        id="accent"
        x1="0%"
        y1="0%"
        x2="100%"
        y2="0%">

        <stop
          offset="0%"
          stop-color="#58a6ff"/>

        <stop
          offset="50%"
          stop-color="#a371f7"/>

        <stop
          offset="100%"
          stop-color="#f778ba"/>

      </linearGradient>

      <filter id="shadow">

        <feDropShadow
          dx="0"
          dy="8"
          stdDeviation="12"
          flood-opacity="0.3"/>

      </filter>

      <style>

        .title {
          font-family:
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            sans-serif;

          font-size: 27px;
          font-weight: 700;
          fill: #f0f6fc;
        }

        .subtitle {
          font-family:
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            sans-serif;

          font-size: 14px;
          fill: #8b949e;
        }

        .label {
          font-family:
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            sans-serif;

          font-size: 14px;
          fill: #8b949e;
        }

        .value {
          font-family:
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            sans-serif;

          font-size: 27px;
          font-weight: 700;
          fill: #f0f6fc;
        }

        .card {
          fill: #161b22;
          stroke: #30363d;
          stroke-width: 1;
        }

        .fade {
          animation:
            fadeIn 0.8s ease-out both;
        }

        @keyframes fadeIn {

          from {
            opacity: 0;
            transform:
              translateY(8px);
          }

          to {
            opacity: 1;
            transform:
              translateY(0);
          }

        }

      </style>

    </defs>

    <rect
      width="100%"
      height="100%"
      rx="20"
      fill="url(#background)"
      filter="url(#shadow)"/>

    <rect
      width="100%"
      height="4"
      rx="2"
      fill="url(#accent)"/>

    <text
      x="36"
      y="52"
      class="title">

      Top Languages

    </text>

    <text
      x="36"
      y="78"
      class="subtitle">

      Language usage across repositories visible to the stats token

    </text>


    <g
      class="fade"
      style="animation-delay:0.0s">

      <text
        x="36"
        y="120"
        class="label">

        JavaScript

      </text>

      <text
        x="860"
        y="120"
        class="label"
        text-anchor="end">

        70.7%

      </text>

      <rect
        x="36"
        y="132"
        width="600"
        height="11"
        rx="5"
        fill="#21262d"/>

      <rect
        x="36"
        y="132"
        width="424.22514480175596"
        height="11"
        rx="5"
        fill="url(#accent)">

        <animate
          attributeName="width"
          from="0"
          to="424.22514480175596"
          dur="1.1s"
          begin="0.0s"
          fill="freeze"/>

      </rect>

    </g>

    

    <g
      class="fade"
      style="animation-delay:0.08s">

      <text
        x="36"
        y="160"
        class="label">

        PHP

      </text>

      <text
        x="860"
        y="160"
        class="label"
        text-anchor="end">

        22.7%

      </text>

      <rect
        x="36"
        y="172"
        width="600"
        height="11"
        rx="5"
        fill="#21262d"/>

      <rect
        x="36"
        y="172"
        width="136.43641487824672"
        height="11"
        rx="5"
        fill="url(#accent)">

        <animate
          attributeName="width"
          from="0"
          to="136.43641487824672"
          dur="1.1s"
          begin="0.08s"
          fill="freeze"/>

      </rect>

    </g>

    

    <g
      class="fade"
      style="animation-delay:0.16s">

      <text
        x="36"
        y="200"
        class="label">

        TypeScript

      </text>

      <text
        x="860"
        y="200"
        class="label"
        text-anchor="end">

        3.0%

      </text>

      <rect
        x="36"
        y="212"
        width="600"
        height="11"
        rx="5"
        fill="#21262d"/>

      <rect
        x="36"
        y="212"
        width="17.86228251211257"
        height="11"
        rx="5"
        fill="url(#accent)">

        <animate
          attributeName="width"
          from="0"
          to="17.86228251211257"
          dur="1.1s"
          begin="0.16s"
          fill="freeze"/>

      </rect>

    </g>

    

    <g
      class="fade"
      style="animation-delay:0.24s">

      <text
        x="36"
        y="240"
        class="label">

        Blade

      </text>

      <text
        x="860"
        y="240"
        class="label"
        text-anchor="end">

        1.4%

      </text>

      <rect
        x="36"
        y="252"
        width="600"
        height="11"
        rx="5"
        fill="#21262d"/>

      <rect
        x="36"
        y="252"
        width="8.513958161884156"
        height="11"
        rx="5"
        fill="url(#accent)">

        <animate
          attributeName="width"
          from="0"
          to="8.513958161884156"
          dur="1.1s"
          begin="0.24s"
          fill="freeze"/>

      </rect>

    </g>

    

    <g
      class="fade"
      style="animation-delay:0.32s">

      <text
        x="36"
        y="280"
        class="label">

        CSS

      </text>

      <text
        x="860"
        y="280"
        class="label"
        text-anchor="end">

        1.3%

      </text>

      <rect
        x="36"
        y="292"
        width="600"
        height="11"
        rx="5"
        fill="#21262d"/>

      <rect
        x="36"
        y="292"
        width="8"
        height="11"
        rx="5"
        fill="url(#accent)">

        <animate
          attributeName="width"
          from="0"
          to="8"
          dur="1.1s"
          begin="0.32s"
          fill="freeze"/>

      </rect>

    </g>

    

    <g
      class="fade"
      style="animation-delay:0.4s">

      <text
        x="36"
        y="320"
        class="label">

        Astro

      </text>

      <text
        x="860"
        y="320"
        class="label"
        text-anchor="end">

        0.8%

      </text>

      <rect
        x="36"
        y="332"
        width="600"
        height="11"
        rx="5"
        fill="#21262d"/>

      <rect
        x="36"
        y="332"
        width="8"
        height="11"
        rx="5"
        fill="url(#accent)">

        <animate
          attributeName="width"
          from="0"
          to="8"
          dur="1.1s"
          begin="0.4s"
          fill="freeze"/>

      </rect>

    </g>

    

    <g
      class="fade"
      style="animation-delay:0.48s">

      <text
        x="36"
        y="360"
        class="label">

        HTML

      </text>

      <text
        x="860"
        y="360"
        class="label"
        text-anchor="end">

        0.1%

      </text>

      <rect
        x="36"
        y="372"
        width="600"
        height="11"
        rx="5"
        fill="#21262d"/>

      <rect
        x="36"
        y="372"
        width="8"
        height="11"
        rx="5"
        fill="url(#accent)">

        <animate
          attributeName="width"
          from="0"
          to="8"
          dur="1.1s"
          begin="0.48s"
          fill="freeze"/>

      </rect>

    </g>

    

<text
  x="36"
  y="445"
  class="subtitle">

  Private repository names are never exposed.

</text>

</svg>