<svg xmlns="http://www.w3.org/2000/svg"
    width="760"
    height="430"
    viewBox="0 0 760 430">

    <defs>

      <linearGradient id="bg"
        x1="0%" y1="0%"
        x2="100%" y2="100%">

        <stop offset="0%" stop-color="#0d1117"/>
        <stop offset="100%" stop-color="#161b22"/>

      </linearGradient>

      <linearGradient id="accent"
        x1="0%" y1="0%"
        x2="100%" y2="0%">

        <stop offset="0%" stop-color="#58a6ff"/>
        <stop offset="100%" stop-color="#a371f7"/>

      </linearGradient>

      <filter id="shadow">

        <feDropShadow
          dx="0"
          dy="8"
          stdDeviation="12"
          flood-opacity="0.25"/>

      </filter>

      <style>

        .title {
          font-family:
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            sans-serif;

          font-size: 25px;
          font-weight: 700;
          fill: #f0f6fc;
        }

        .subtitle {
          font-family:
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            sans-serif;

          font-size: 13px;
          fill: #8b949e;
        }

        .label {
          font-family:
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            sans-serif;

          font-size: 14px;
          fill: #8b949e;
        }

        .number {
          font-family:
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            sans-serif;

          font-size: 26px;
          font-weight: 700;
          fill: #f0f6fc;
        }

        .animate {
          animation:
            fadeIn 1.2s ease-out;
        }

        @keyframes fadeIn {
          from {
            opacity: 0;
            transform: translateY(8px);
          }

          to {
            opacity: 1;
            transform: translateY(0);
          }
        }

      </style>

    </defs>

    <rect
      width="100%"
      height="100%"
      rx="18"
      fill="url(#bg)"
      filter="url(#shadow)"/>

    <rect
      x="0"
      y="0"
      width="100%"
      height="4"
      rx="2"
      fill="url(#accent)"/>

    <text
      x="35"
      y="50"
      class="title">

      Top Languages

    </text>

    <text
      x="35"
      y="75"
      class="subtitle">

      Languages used across public repositories

    </text>

    <g class="animate">

      <text
        x="35"
        y="120"
        class="label">

        JavaScript

      </text>

      <text
        x="725"
        y="120"
        class="label"
        text-anchor="end">

        84.9%

      </text>

      <rect
        x="35"
        y="132"
        width="480"
        height="9"
        rx="4"
        fill="#21262d"/>

      <rect
        x="35"
        y="132"
        width="407.7146800381535"
        height="9"
        rx="4"
        fill="url(#accent)">

        <animate
          attributeName="width"
          from="0"
          to="407.7146800381535"
          dur="1.2s"
          fill="freeze"/>

      </rect>

    </g>
    
    <g class="animate">

      <text
        x="35"
        y="162"
        class="label">

        CSS

      </text>

      <text
        x="725"
        y="162"
        class="label"
        text-anchor="end">

        8.5%

      </text>

      <rect
        x="35"
        y="174"
        width="480"
        height="9"
        rx="4"
        fill="#21262d"/>

      <rect
        x="35"
        y="174"
        width="40.94488524642576"
        height="9"
        rx="4"
        fill="url(#accent)">

        <animate
          attributeName="width"
          from="0"
          to="40.94488524642576"
          dur="1.2s"
          fill="freeze"/>

      </rect>

    </g>
    
    <g class="animate">

      <text
        x="35"
        y="204"
        class="label">

        Astro

      </text>

      <text
        x="725"
        y="204"
        class="label"
        text-anchor="end">

        6.2%

      </text>

      <rect
        x="35"
        y="216"
        width="480"
        height="9"
        rx="4"
        fill="#21262d"/>

      <rect
        x="35"
        y="216"
        width="29.997602084587797"
        height="9"
        rx="4"
        fill="url(#accent)">

        <animate
          attributeName="width"
          from="0"
          to="29.997602084587797"
          dur="1.2s"
          fill="freeze"/>

      </rect>

    </g>
    
    <g class="animate">

      <text
        x="35"
        y="246"
        class="label">

        HTML

      </text>

      <text
        x="725"
        y="246"
        class="label"
        text-anchor="end">

        0.3%

      </text>

      <rect
        x="35"
        y="258"
        width="480"
        height="9"
        rx="4"
        fill="#21262d"/>

      <rect
        x="35"
        y="258"
        width="8"
        height="9"
        rx="4"
        fill="url(#accent)">

        <animate
          attributeName="width"
          from="0"
          to="8"
          dur="1.2s"
          fill="freeze"/>

      </rect>

    </g>
    

  <text
    x="35"
    y="395"
    class="subtitle">

    Based on language usage across public repositories

  </text>

  </svg>
